services:
  mysql:
    image: mysql:8.4
    container_name: food_mysql
    environment:
      MYSQL_DATABASE: food_management_db
      MYSQL_USER: food_app
      MYSQL_PASSWORD: food_app_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: food_app
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      DB_ENGINE: mysql
      DB_NAME: food_management_db
      DB_USER: food_app
      DB_PASSWORD: food_app_password
      DB_HOST: mysql
      DB_PORT: 3306
      DEBUG: "True"
      SECRET_KEY: django-development-key
      ALLOWED_HOSTS: localhost,127.0.0.1
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
